name: boot-test

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      gpu:
        description: Emulator -gpu mode
        default: swiftshader_indirect

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      IMAGE_URL: https://nexus-playground.pleos.ai/repository/raw-releases/connect-avd/2.x/crp_car_emulator.zip
      GPU_MODE: ${{ inputs.gpu || 'swiftshader_indirect' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build app
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install emulator and Pleos image
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" emulator platform-tools > /dev/null
          curl -fsSL -o /tmp/image.zip "$IMAGE_URL"
          unzip -q /tmp/image.zip -d /tmp/image
          rm /tmp/image.zip
          IMAGE_DIR=$(dirname "$(find /tmp/image -name system.img | head -1)")
          DEST="$ANDROID_HOME/system-images/android-34/pleos_car_emulator/x86_64"
          mkdir -p "$(dirname "$DEST")"
          mv "$IMAGE_DIR" "$DEST"

      - name: Create AVD
        run: |
          AVD="$HOME/.android/avd"
          mkdir -p "$AVD/pleos.avd"
          printf 'avd.ini.encoding=UTF-8\npath=%s/pleos.avd\ntarget=android-34\n' "$AVD" > "$AVD/pleos.ini"
          cat > "$AVD/pleos.avd/config.ini" <<'CONFIG'
          AvdId=pleos
          abi.type=x86_64
          hw.cpu.arch=x86_64
          hw.cpu.ncore=2
          hw.ramSize=4096
          hw.gpu.enabled=yes
          hw.lcd.width=1920
          hw.lcd.height=1080
          hw.lcd.density=160
          hw.keyboard=yes
          disk.dataPartition.size=6G
          image.sysdir.1=system-images/android-34/pleos_car_emulator/x86_64/
          tag.id=android-automotive
          CONFIG
          sed -i 's/^ *//' "$AVD/pleos.avd/config.ini"

      - name: Boot
        id: boot
        run: |
          mkdir -p out
          nohup "$ANDROID_HOME/emulator/emulator" -avd pleos -no-window -no-audio -no-snapshot \
            -no-boot-anim -gpu "$GPU_MODE" -verbose > out/emulator.log 2>&1 &
          ADB="$ANDROID_HOME/platform-tools/adb"
          for i in $(seq 1 60); do
            sleep 30
            state=$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "$((i / 2)) min: boot_completed=${state:-none}"
            if [ "$state" = "1" ]; then echo "booted=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "booted=false" >> "$GITHUB_OUTPUT"

      - name: Run probe app
        if: steps.boot.outputs.booted == 'true'
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          sleep 90
          "$ADB" install -g -r app/build/outputs/apk/debug/app-debug.apk 2>&1 | tee out/install.txt
          "$ADB" logcat -c
          "$ADB" shell am start -n test.probe/.MainActivity 2>&1 | tee out/start.txt
          sleep 40
          "$ADB" exec-out screencap -p > out/1-parked.png || true
          "$ADB" root || true
          sleep 5
          # AOSP property ids: GEAR_SELECTION (D=8), PERF_VEHICLE_SPEED (m/s).
          "$ADB" shell cmd car_service inject-vhal-event 0x11400400 8 2>&1 | tee out/inject.txt || true
          "$ADB" shell cmd car_service inject-vhal-event 0x11600207 16.67 2>&1 | tee -a out/inject.txt || true
          sleep 35
          "$ADB" exec-out screencap -p > out/2-driving.png || true
          "$ADB" shell dumpsys activity activities | grep -E 'ResumedActivity' > out/resumed.txt || true
          "$ADB" logcat -d > out/logcat.txt || true
          grep ' PROBE' out/logcat.txt | sed -E 's/^.*PROBE *: //' > out/probe.txt || true
          cat out/probe.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-results
          path: out
          retention-days: 3

      - name: Report
        if: always()
        run: test "${{ steps.boot.outputs.booted }}" = "true"
